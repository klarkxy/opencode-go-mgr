            - region [ref=f1e552]:
              - heading "账号路由" [level=3] [ref=f1e553]
              - paragraph [ref=f1e554]: 基础路由方案同一时刻只能选一个；对话粘性是可叠加开关，不会替换基础方案。
              - generic [ref=f1e555]:
                - generic [ref=f1e556]:
                  - generic "严格优先级" [ref=f1e557] [cursor=pointer]:
                    - generic [ref=f1e558]:
                      - radio "严格优先级" [checked]
                  - generic [ref=f1e561]:
                    - paragraph [ref=f1e562]: 每次新请求按账号排序选择第一个可用账号。
                    - paragraph [ref=f1e563]: 优点：行为确定，高优先级账号恢复后立即接管。
                    - paragraph [ref=f1e564]: 缺点：冷却恢复可能切换账号，影响按凭据隔离的 prompt cache。
                - generic [ref=f1e565]:
                  - generic "全局粘性" [ref=f1e566] [cursor=pointer]:
                    - generic [ref=f1e567]:
                      - radio "全局粘性"
                  - generic [ref=f1e570]:
                    - paragraph [ref=f1e571]: 无对话绑定时优先沿用当前全局账号，不可用时再按排序切换。
                    - paragraph [ref=f1e572]: 优点：低并发时更容易保持 prompt cache，不会因高优先级恢复而无谓抢切。
                    - paragraph [ref=f1e573]: 缺点：所有并发对话共享一个账号，恢复后不会自动抢回流量。
                - generic [ref=f1e574]:
                  - generic "轮询" [ref=f1e575] [cursor=pointer]:
                    - generic [ref=f1e576]:
                      - radio "轮询"
                  - generic [ref=f1e579]:
                    - paragraph [ref=f1e580]: 每个新请求从上次位置之后循环选择下一个可用账号。
                    - paragraph [ref=f1e581]: 优点：多账号可用时分摊请求、额度和风险。
                    - paragraph [ref=f1e582]: 缺点：账号切换最频繁，prompt cache 命中通常较差，且不是加权均衡。
              - generic [ref=f1e583]:
