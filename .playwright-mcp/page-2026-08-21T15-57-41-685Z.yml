                    - paragraph [ref=e348]: 优点：低并发时更容易保持 prompt cache，不会因高优先级恢复而无谓抢切。
                    - paragraph [ref=e349]: 缺点：所有并发对话共享一个账号，恢复后不会自动抢回流量。
