            - region [ref=e328]:
              - heading "账号路由" [level=3] [ref=e329]
              - paragraph [ref=e330]: 基础路由方案同一时刻只能选一个；对话粘性是可叠加开关，不会替换基础方案。
              - generic [ref=e331]:
                - generic [ref=e332]:
                  - generic "严格优先级" [ref=e333] [cursor=pointer]:
                    - generic [ref=e334]:
                      - radio "严格优先级" [checked]
                  - generic [ref=e337]:
                    - paragraph [ref=e338]: 每次新请求按账号排序选择第一个可用账号。
                    - paragraph [ref=e339]: 优点：行为确定，高优先级账号恢复后立即接管。
                    - paragraph [ref=e340]: 缺点：冷却恢复可能切换账号，影响按凭据隔离的 prompt cache。
                - generic [ref=e341]:
                  - generic "全局粘性" [ref=e342] [cursor=pointer]:
                    - generic [ref=e343]:
                      - radio "全局粘性"
                  - generic [ref=e346]:
                    - paragraph [ref=e347]: 无对话绑定时优先沿用当前全局账号，不可用时再按排序切换。
                    - paragraph [ref=e348]: 优点：低并发时更容易保持 prompt cache，不会因高优先级恢复而无谓抢切。
                    - paragraph [ref=e349]: 缺点：所有并发对话共享一个账号，恢复后不会自动抢回流量。
                - generic [ref=e350]:
                  - generic "轮询" [ref=e351] [cursor=pointer]:
                    - generic [ref=e352]:
                      - radio "轮询"
                  - generic [ref=e355]:
                    - paragraph [ref=e356]: 每个新请求从上次位置之后循环选择下一个可用账号。
                    - paragraph [ref=e357]: 优点：多账号可用时分摊请求、额度和风险。
                    - paragraph [ref=e358]: 缺点：账号切换最频繁，prompt cache 命中通常较差，且不是加权均衡。
