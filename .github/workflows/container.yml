name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to publish, for example v1.2.3
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean
      source_ref:
        description: Optional git ref/SHA to build from (default = the release tag). Use main for hotfixes without retargeting the tag.
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: ghcr-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      browser_image: ${{ steps.release.outputs.browser_image }}
      full_sha: ${{ steps.commit.outputs.full_sha }}
      image: ${{ steps.release.outputs.image }}
      minor: ${{ steps.release.outputs.minor }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
      stable: ${{ steps.release.outputs.stable }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REQUESTED_LATEST: ${{ inputs.publish_latest || false }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a container-compatible semver tag without build metadata, got: $RELEASE_TAG" >&2
            exit 1
          fi

          version=${RELEASE_TAG#v}
          stable=false
          minor=
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            stable=true
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi
          publish_latest=false
          if [[ "$stable" == true ]] && { \
            [[ "$GITHUB_EVENT_NAME" == release && "$RELEASE_PRERELEASE" != true ]] \
            || [[ "$REQUESTED_LATEST" == true ]]; \
          }; then
            publish_latest=true
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"
          # GHCR package names are independent of the renamed source repository.
          # Keep existing public packages and Compose installs on the same channels.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencode-go-mgr"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "browser_image=${image}-browser" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # workflow_dispatch may build a hotfix ref while still publishing the release tag name.
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || format('refs/tags/{0}', steps.release.outputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and repository version
        shell: bash
        env:
          OCG_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          OCG_SOURCE_REF: ${{ inputs.source_ref || '' }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/$OCG_RELEASE_TAG"
          # Ensure the release tag exists even when building from a hotfix ref.
          git fetch --no-tags origin "+$expected_ref:$expected_ref" || true
          if ! git show-ref --verify --quiet "$expected_ref"; then
            git fetch --no-tags origin "refs/tags/$OCG_RELEASE_TAG:refs/tags/$OCG_RELEASE_TAG"
          fi
          git show-ref --verify --quiet "$expected_ref"
          tag_commit=$(git rev-parse "$expected_ref^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [[ -z "${OCG_SOURCE_REF}" ]]; then
            if [[ "$head_commit" != "$tag_commit" ]]; then
              echo "Checked-out commit $head_commit does not match $expected_ref ($tag_commit)." >&2
              exit 1
            fi
          else
            echo "Building hotfix source $head_commit for image tag $OCG_RELEASE_TAG (tag commit $tag_commit)."
          fi
          node scripts/release.mjs --check

      - name: Resolve release commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify GHCR images (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    outputs:
      browser_digest_amd64: ${{ steps.record_amd64.outputs.browser_digest }}
      browser_digest_arm64: ${{ steps.record_arm64.outputs.browser_digest }}
      digest_amd64: ${{ steps.record_amd64.outputs.digest }}
      digest_arm64: ${{ steps.record_arm64.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      SMOKE_BROWSER_CONTAINER: ocg-browser-smoke-${{ github.run_id }}-${{ matrix.arch }}
      SMOKE_BROWSER_IMAGE: ocg-browser:smoke-${{ github.run_id }}-${{ matrix.arch }}
      SMOKE_BROWSER_PROFILE_VOLUME: ocg-browser-profile-smoke-${{ github.run_id }}-${{ matrix.arch }}
      SMOKE_BROWSER_RUNTIME_VOLUME: ocg-browser-runtime-smoke-${{ github.run_id }}-${{ matrix.arch }}
      SMOKE_IMAGE: ocg-manager:smoke-${{ github.run_id }}-${{ matrix.arch }}
      SMOKE_CONTAINER: ocg-manager-smoke-${{ github.run_id }}-${{ matrix.arch }}
      SMOKE_VOLUME: ocg-manager-smoke-${{ github.run_id }}-${{ matrix.arch }}

    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Resolve is the only job allowed to interpret a mutable branch or tag.
          ref: ${{ needs.resolve.outputs.full_sha }}
          persist-credentials: false

      - name: Verify resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.full_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Build checkout drifted from resolved commit: $actual_sha != $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Smoke runs on amd64 only; the arm64 leg builds and pushes without it.
      - name: Build smoke images
        if: matrix.arch == 'amd64'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ./docker-bake.hcl
          targets: smoke
          load: true
          provenance: false
          sbom: false
          vars: |
            SMOKE_IMAGE=${{ env.SMOKE_IMAGE }}
            SMOKE_BROWSER_IMAGE=${{ env.SMOKE_BROWSER_IMAGE }}
            CACHE_SCOPE=ocg-manager-linux-${{ matrix.arch }}
            CACHE_BROWSER_SCOPE=ocg-browser-linux-${{ matrix.arch }}

      - name: Smoke-test container
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail

          docker volume create "$SMOKE_VOLUME" >/dev/null
          docker run --detach \
            --name "$SMOKE_CONTAINER" \
            --publish 127.0.0.1:19042:9042 \
            --volume "$SMOKE_VOLUME:/data" \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --health-interval 2s \
            --health-timeout 2s \
            --health-start-period 1s \
            --health-retries 15 \
            "$SMOKE_IMAGE" >/dev/null

          status=starting
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$SMOKE_CONTAINER")
            if [[ "$status" == healthy ]]; then
              break
            fi
            if [[ "$status" == unhealthy ]]; then
              echo "Container became unhealthy." >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$status" != healthy ]]; then
            echo "Container did not become healthy; last status: $status" >&2
            exit 1
          fi

          docker exec "$SMOKE_CONTAINER" test -f /usr/share/licenses/ocg-manager/LICENSE

          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:19042/dashboard/ > "$RUNNER_TEMP/dashboard.html"
          grep -q 'id="app"' "$RUNNER_TEMP/dashboard.html"

          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:19042/dashboard/api/auth/status \
            > "$RUNNER_TEMP/auth-status.json"

          settings_status=$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:19042/dashboard/api/settings)
          if [[ "$settings_status" != 401 ]]; then
            echo "Expected unauthenticated settings request to return 401, got $settings_status" >&2
            exit 1
          fi

      - name: Smoke-test browser container and real Chromium
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail

          docker volume create "$SMOKE_BROWSER_PROFILE_VOLUME" >/dev/null
          docker volume create "$SMOKE_BROWSER_RUNTIME_VOLUME" >/dev/null
          docker run --detach \
            --name "$SMOKE_BROWSER_CONTAINER" \
            --volume "$SMOKE_BROWSER_PROFILE_VOLUME:/profiles" \
            --volume "$SMOKE_BROWSER_RUNTIME_VOLUME:/run/ocg-browser" \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1777 \
            --tmpfs /home/ocg:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700 \
            --shm-size 1g \
            --cap-drop ALL \
            --security-opt seccomp=unconfined \
            --health-interval 2s \
            --health-timeout 3s \
            --health-start-period 5s \
            --health-retries 20 \
            "$SMOKE_BROWSER_IMAGE" >/dev/null

          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$SMOKE_BROWSER_CONTAINER")
            if [[ "$status" == healthy ]]; then
              break
            fi
            if [[ "$status" == unhealthy ]]; then
              docker logs "$SMOKE_BROWSER_CONTAINER" >&2
              echo "Browser container became unhealthy." >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$status" != healthy ]]; then
            docker logs "$SMOKE_BROWSER_CONTAINER" >&2
            echo "Browser container did not become healthy; last status: $status" >&2
            exit 1
          fi

          docker exec "$SMOKE_BROWSER_CONTAINER" test -f \
            /usr/share/licenses/ocg-browser-worker/LICENSE
          published_ports=$(docker port "$SMOKE_BROWSER_CONTAINER")
          if [[ -n "$published_ports" ]]; then
            echo "Browser worker unexpectedly published host ports: $published_ports" >&2
            exit 1
          fi

          docker exec "$SMOKE_BROWSER_CONTAINER" python3 -c '
          import json
          import urllib.request

          token = open("/run/ocg-browser/control-token", encoding="utf-8").read().strip()
          request = urllib.request.Request(
              "http://127.0.0.1:9080/session",
              data=json.dumps({"account_id": "ci-smoke", "url": "https://opencode.ai/zen/go"}).encode(),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.load(response)
          assert payload["active"] is True, payload
          assert payload["account_id"] == "ci-smoke", payload
          assert payload["vnc_ws_url"].startswith("ws://browser:6080/"), payload

          import glob
          import os
          commands = []
          for path in glob.glob("/proc/[0-9]*/cmdline"):
              try:
                  arguments = [
                      value.decode(errors="replace")
                      for value in open(path, "rb").read().split(b"\0")
                      if value
                  ]
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue
              if not arguments:
                  continue
              executable = os.path.basename(arguments[0]).lower()
              if executable in {"chromium", "chromium-browser", "chrome", "google-chrome"}:
                  commands.append(" ".join(arguments))
          assert commands, "no live Chromium process found"
          combined = "\n".join(commands).lower()
          assert "--user-data-dir=/profiles/ci-smoke" in combined, combined
          for forbidden in ("--no-sandbox", "remote-debugging", "automation", "disable-web-security"):
              assert forbidden not in combined, combined
          '
          docker exec "$SMOKE_BROWSER_CONTAINER" test -d /profiles/ci-smoke

      - name: Show browser smoke logs on failure
        if: failure() && matrix.arch == 'amd64'
        shell: bash
        run: docker logs "$SMOKE_BROWSER_CONTAINER" 2>&1 || true

      - name: Clean up smoke test
        if: always() && matrix.arch == 'amd64'
        shell: bash
        run: |
          docker rm --force "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
          docker rm --force "$SMOKE_BROWSER_CONTAINER" >/dev/null 2>&1 || true
          docker volume rm "$SMOKE_VOLUME" >/dev/null 2>&1 || true
          docker volume rm "$SMOKE_BROWSER_PROFILE_VOLUME" >/dev/null 2>&1 || true
          docker volume rm "$SMOKE_BROWSER_RUNTIME_VOLUME" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.resolve.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Open Console Gateway
            org.opencontainers.image.description=OpenCode-Go multi-account local manager and gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.full_sha }}

      - name: Generate browser image metadata
        id: meta_browser
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.resolve.outputs.browser_image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Open Console Gateway Browser Worker
            org.opencontainers.image.description=Isolated Chromium and noVNC sidecar for Open Console Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.full_sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            index:org.opencontainers.image.revision=${{ needs.resolve.outputs.full_sha }}
          cache-from: type=gha,scope=ocg-manager-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ocg-manager-linux-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Build and push browser image
        id: push_browser
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.browser
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.resolve.outputs.browser_image }},push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          labels: ${{ steps.meta_browser.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            index:org.opencontainers.image.revision=${{ needs.resolve.outputs.full_sha }}
          cache-from: type=gha,scope=ocg-browser-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ocg-browser-linux-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Record amd64 digests
        id: record_amd64
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "browser_digest=${{ steps.push_browser.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Record arm64 digests
        id: record_arm64
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "browser_digest=${{ steps.push_browser.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish immutable and moving GHCR tags
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ghcr-moving-channels
      queue: max
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Run the helper paired with this trusted workflow definition. The
          # release source itself was resolved once and built at full_sha.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify trusted workflow commit
        shell: bash
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$EXPECTED_WORKFLOW_SHA" ]]; then
            echo "Publish checkout drifted from trusted workflow commit: $actual_sha != $EXPECTED_WORKFLOW_SHA" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify immutable version and commit tags
        id: immutable
        shell: bash
        env:
          BROWSER_DIGEST_AMD64: ${{ needs.build.outputs.browser_digest_amd64 }}
          BROWSER_DIGEST_ARM64: ${{ needs.build.outputs.browser_digest_arm64 }}
          BROWSER_IMAGE: ${{ needs.resolve.outputs.browser_image }}
          CANDIDATE_VERSION: ${{ needs.resolve.outputs.version }}
          FULL_SHA: ${{ needs.resolve.outputs.full_sha }}
          MAIN_DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
          MAIN_DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
          MAIN_IMAGE: ${{ needs.resolve.outputs.image }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: bash scripts/container-publish.sh publish-immutable
      - name: Verify public anonymous GHCR pulls
        shell: bash
        env:
          BROWSER_IMAGE: ${{ needs.resolve.outputs.browser_image }}
          CANDIDATE_VERSION: ${{ needs.resolve.outputs.version }}
          MAIN_IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          anonymous_docker_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_docker_config"' EXIT
          export DOCKER_CONFIG="$anonymous_docker_config"
          docker pull --quiet "$MAIN_IMAGE:$CANDIDATE_VERSION"
          docker pull --quiet "$BROWSER_IMAGE:$CANDIDATE_VERSION"

          verify_public_index() {
            local ref=$1
            local arches
            arches=$(docker buildx imagetools inspect --raw "$ref" \
              | jq -r '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | sort | unique | join(",")')
            if [[ "$arches" != "amd64,arm64" ]]; then
              echo "Public manifest $ref does not expose both linux/amd64 and linux/arm64: $arches" >&2
              exit 1
            fi
          }
          verify_public_index "$MAIN_IMAGE:$CANDIDATE_VERSION"
          verify_public_index "$BROWSER_IMAGE:$CANDIDATE_VERSION"
          test "$(docker image inspect --format '{{.Architecture}}' "$MAIN_IMAGE:$CANDIDATE_VERSION")" = amd64
          test "$(docker image inspect --format '{{.Architecture}}' "$BROWSER_IMAGE:$CANDIDATE_VERSION")" = amd64

      - name: Generate signed GitHub provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ needs.resolve.outputs.image }}
          subject-digest: ${{ steps.immutable.outputs.main_digest }}
          push-to-registry: true

      - name: Generate signed GitHub provenance for browser image
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ needs.resolve.outputs.browser_image }}
          subject-digest: ${{ steps.immutable.outputs.browser_digest }}
          push-to-registry: true

      - name: Re-read and advance paired moving channels
        shell: bash
        env:
          BROWSER_DIGEST: ${{ steps.immutable.outputs.browser_digest }}
          BROWSER_DIGEST_AMD64: ${{ needs.build.outputs.browser_digest_amd64 }}
          BROWSER_DIGEST_ARM64: ${{ needs.build.outputs.browser_digest_arm64 }}
          BROWSER_IMAGE: ${{ needs.resolve.outputs.browser_image }}
          CANDIDATE_VERSION: ${{ needs.resolve.outputs.version }}
          FULL_SHA: ${{ needs.resolve.outputs.full_sha }}
          MAIN_DIGEST: ${{ steps.immutable.outputs.main_digest }}
          MAIN_DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
          MAIN_DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
          MAIN_IMAGE: ${{ needs.resolve.outputs.image }}
          MINOR_CHANNEL: ${{ needs.resolve.outputs.minor }}
          PUBLISH_LATEST: ${{ needs.resolve.outputs.publish_latest }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          STABLE: ${{ needs.resolve.outputs.stable }}
        run: bash scripts/container-publish.sh advance-moving
